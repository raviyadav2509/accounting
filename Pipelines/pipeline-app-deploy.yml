trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip
  BAS_DATABASE_FILE: $(Agent.TempDirectory)/bas-ci.db
  FLASK_SECRET_KEY: ci-only-secret-not-for-production

steps:
  - task: UsePythonVersion@0
    displayName: Use Python $(pythonVersion)
    inputs:
      versionSpec: $(pythonVersion)
      addToPath: true

  - task: Cache@2
    displayName: Cache Python packages
    inputs:
      key: 'pip | "$(Agent.OS)" | requirements.txt | requirements-dev.txt'
      restoreKeys: |
        pip | "$(Agent.OS)"
      path: $(PIP_CACHE_DIR)

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements-dev.txt
    displayName: Install dependencies

  - script: python -m compileall -q app.py config.py routes services
    displayName: Compile Python sources

  - script: python -m pytest
    displayName: Run automated tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'test-results.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: UseDotNet@2
    displayName: Install coverage publisher prerequisite
    condition: succeededOrFailed()
    inputs:
      packageType: sdk
      version: '8.x'

  - task: PublishCodeCoverageResults@2
    displayName: Publish code coverage
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      pathToSources: '$(System.DefaultWorkingDirectory)'
      failIfCoverageEmpty: true

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $packageBuilder = Join-Path '$(Build.SourcesDirectory)' 'Pipelines/utility/package_app.py'
      $packagePath = Join-Path '$(Build.ArtifactStagingDirectory)' 'accounting.zip'
      New-Item -ItemType Directory -Path '$(Build.ArtifactStagingDirectory)' -Force | Out-Null
      & python $packageBuilder --source '$(Build.SourcesDirectory)' --output $packagePath
      if ($LASTEXITCODE -ne 0) {
        throw "Application packaging failed (exit code $LASTEXITCODE)."
      }
    displayName: Package tested application for Azure

  - task: PublishPipelineArtifact@1
    displayName: Publish application package
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/accounting.zip'
      artifact: accounting

  - task: AzureCLI@2
    displayName: Deploy tested package to Dev Web App
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      azureSubscription: azure-accounting-wif
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: '$(Build.SourcesDirectory)/Pipelines/scripts/deploy-app.ps1'
    env:
      APP_PACKAGE: '$(Build.ArtifactStagingDirectory)/accounting.zip'
