trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip
  BAS_DATABASE_FILE: $(Agent.TempDirectory)/bas-ci.db
  FLASK_SECRET_KEY: ci-only-secret-not-for-production

steps:
  - task: UsePythonVersion@0
    displayName: Use Python $(pythonVersion)
    inputs:
      versionSpec: $(pythonVersion)
      addToPath: true

  - task: Cache@2
    displayName: Cache Python packages
    inputs:
      key: 'pip | "$(Agent.OS)" | requirements.txt | requirements-dev.txt'
      restoreKeys: |
        pip | "$(Agent.OS)"
      path: $(PIP_CACHE_DIR)

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements-dev.txt
    displayName: Install dependencies

  - script: python -m compileall -q app.py config.py routes services
    displayName: Compile Python sources

  - script: python -m pytest
    displayName: Run automated tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'test-results.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: UseDotNet@2
    displayName: Install coverage publisher prerequisite
    condition: succeededOrFailed()
    inputs:
      packageType: sdk
      version: '8.x'

  - task: PublishCodeCoverageResults@2
    displayName: Publish code coverage
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      pathToSources: '$(System.DefaultWorkingDirectory)'
      failIfCoverageEmpty: true

  - script: |
      mkdir -p "$(Build.ArtifactStagingDirectory)"
      git archive --format=zip --output="$(Build.ArtifactStagingDirectory)/accounting.zip" HEAD app.py config.py requirements.txt routes services templates static
    displayName: Package tested application (exclude databases and secrets)

  - task: PublishPipelineArtifact@1
    displayName: Publish application package
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/accounting.zip'
      artifact: accounting
