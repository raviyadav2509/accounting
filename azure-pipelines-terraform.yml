# Create a separate Azure Pipeline using this YAML. Existing app CI is unchanged.
trigger: none
pr: none

parameters:
  - name: action
    displayName: Terraform action
    type: string
    default: plan
    values:
      - plan
      - apply
  - name: azureServiceConnection
    displayName: Azure workload identity service connection
    type: string
    default: azure-accounting-wif

pool:
  vmImage: ubuntu-latest

variables:
  - group: accounting-terraform
  - name: terraformVersion
    value: '1.9.8'
  - name: terraformDirectory
    value: '$(Build.SourcesDirectory)/infra/azure'

jobs:
  - job: Terraform
    displayName: Terraform ${{ parameters.action }}
    timeoutInMinutes: 60
    steps:
      - checkout: self
        clean: true
        persistCredentials: false

      - bash: |
          set -euo pipefail
          install_dir="$(Agent.TempDirectory)/terraform-bin"
          mkdir -p "$install_dir"
          cd "$install_dir"
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          base_url="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$base_url/$archive" -o "$archive"
          curl --fail --silent --show-error --location --retry 3 "$base_url/terraform_${TERRAFORM_VERSION}_SHA256SUMS" -o SHA256SUMS
          awk -v file="$archive" '$2 == file { print }' SHA256SUMS > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          unzip -o "$archive" terraform
          echo "##vso[task.prependpath]$install_dir"
          ./terraform version
        displayName: Install checksum-verified Terraform
        env:
          TERRAFORM_VERSION: $(terraformVersion)

      - task: AzureCLI@2
        displayName: Validate, plan and optionally apply infrastructure
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: '$(terraformDirectory)/scripts/run-terraform.sh'
          workingDirectory: $(terraformDirectory)
          addSpnToEnvironment: true
          visibleAzLogin: false
        env:
          TF_IN_AUTOMATION: 'true'
          TF_INPUT: 'false'
          TF_ACTION: ${{ parameters.action }}
          TF_PLAN_PATH: '$(Agent.TempDirectory)/accounting-$(Build.BuildId).tfplan'
          TF_STATE_RESOURCE_GROUP: $(stateResourceGroup)
          TF_STATE_STORAGE_ACCOUNT: $(stateStorageAccount)
          TF_STATE_CONTAINER: $(stateContainer)
          TF_STATE_KEY: $(stateKey)
          TF_VAR_qbo_client_id: $(qboClientId)
          TF_VAR_qbo_client_secret: $(qboClientSecret)
          TF_VAR_openai_api_key: $(openaiApiKey)

      - bash: |
          rm -f -- "$(Agent.TempDirectory)/accounting-$(Build.BuildId).tfplan"
          rm -rf -- "$(terraformDirectory)/.terraform"
        displayName: Remove temporary plan and backend cache
        condition: always()
