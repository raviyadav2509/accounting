# One run: save a plan, pass Terraform-Dev-Env checks, then apply that exact plan.
trigger: none
pr: none

parameters:
  - name: azureServiceConnection
    displayName: Azure workload identity service connection
    type: string
    default: azure-accounting-wif

pool:
  vmImage: ubuntu-latest

variables:
  - group: accounting-terraform
  - name: terraformVersion
    value: '1.9.8'
  - name: terraformDirectory
    value: '$(Build.SourcesDirectory)/infra/azure'
  - name: terraformPlanDirectory
    value: '$(Pipeline.Workspace)/terraform-plan'

stages:
  - stage: Plan
    displayName: Terraform plan
    jobs:
      - job: GeneratePlan
        timeoutInMinutes: 60
        steps:
          - template: infra/azure/pipeline-steps/setup.yml

          - task: AzureCLI@2
            displayName: Validate and save Terraform plan
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '$(terraformDirectory)/scripts/run-terraform.sh'
              workingDirectory: $(terraformDirectory)
              addSpnToEnvironment: true
              visibleAzLogin: false
            env:
              TF_IN_AUTOMATION: 'true'
              TF_INPUT: 'false'
              TF_ACTION: plan
              TF_PLAN_DIRECTORY: $(terraformPlanDirectory)
              TF_RUN_ID: $(Build.BuildId)
              TF_SOURCE_VERSION: $(Build.SourceVersion)
              TERRAFORM_VERSION: $(terraformVersion)
              TF_STATE_RESOURCE_GROUP: $(stateResourceGroup)
              TF_STATE_STORAGE_ACCOUNT: $(stateStorageAccount)
              TF_STATE_CONTAINER: $(stateContainer)
              TF_STATE_KEY: $(stateKey)
              TF_VAR_qbo_client_id: $(qboClientId)
              TF_VAR_qbo_client_secret: $(qboClientSecret)
              TF_VAR_openai_api_key: $(openaiApiKey)

          # Saved plans include secrets. Restrict run/artifact access and retention.
          - task: PublishPipelineArtifact@1
            displayName: Retain saved plan for this run
            inputs:
              targetPath: $(terraformPlanDirectory)
              artifact: terraform-plan

          - template: infra/azure/pipeline-steps/cleanup.yml

  - stage: Apply
    displayName: Apply approved Terraform plan
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: ApplySavedPlan
        displayName: Deploy Terraform to development
        timeoutInMinutes: 60
        environment: Terraform-Dev-Env
        strategy:
          runOnce:
            deploy:
              steps:
                # Download only the explicitly selected artifact from this run.
                - download: none
                - template: infra/azure/pipeline-steps/setup.yml

                - task: DownloadPipelineArtifact@2
                  displayName: Download this run's saved plan
                  inputs:
                    buildType: current
                    artifactName: terraform-plan
                    targetPath: $(terraformPlanDirectory)

                - task: AzureCLI@2
                  displayName: Apply saved plan without replanning
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: '$(terraformDirectory)/scripts/run-terraform.sh'
                    workingDirectory: $(terraformDirectory)
                    addSpnToEnvironment: true
                    visibleAzLogin: false
                  env:
                    TF_IN_AUTOMATION: 'true'
                    TF_INPUT: 'false'
                    TF_ACTION: apply
                    TF_PLAN_DIRECTORY: $(terraformPlanDirectory)
                    TF_RUN_ID: $(Build.BuildId)
                    TF_SOURCE_VERSION: $(Build.SourceVersion)
                    TERRAFORM_VERSION: $(terraformVersion)
                    TF_STATE_RESOURCE_GROUP: $(stateResourceGroup)
                    TF_STATE_STORAGE_ACCOUNT: $(stateStorageAccount)
                    TF_STATE_CONTAINER: $(stateContainer)
                    TF_STATE_KEY: $(stateKey)

                - template: infra/azure/pipeline-steps/cleanup.yml
