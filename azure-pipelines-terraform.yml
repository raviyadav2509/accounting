# Each environment plans and applies its own saved plan and state.
# Apply stages are gated by checks on the corresponding Azure DevOps Environment.
trigger: none
pr: none

parameters:
  - name: azureServiceConnection
    displayName: Azure workload identity service connection
    type: string
    default: azure-accounting-wif

pool:
  vmImage: ubuntu-latest

variables:
  - group: accounting-terraform
  # Move the existing storage account here before running this pipeline.
  - name: stateResourceGroup
    value: rg-tfstate-sa
  - name: terraformVersion
    value: '1.9.8'
  - name: terraformDirectory
    value: '$(Build.SourcesDirectory)/infra/azure'
  - name: terraformPlanDirectory
    value: '$(Pipeline.Workspace)/terraform-plan'

stages:
  - template: infra/azure/pipeline-steps/environment-stages.yml
    parameters:
      stageSuffix: Dev
      environmentName: dev
      azureEnvironment: Terraform-Dev-Env
      variableGroup: accounting-terraform-dev
      # Preserve the exact existing Dev blob; do not reset or copy its state.
      stateKey: $(stateKey)
      azureServiceConnection: ${{ parameters.azureServiceConnection }}

  - template: infra/azure/pipeline-steps/environment-stages.yml
    parameters:
      stageSuffix: Test
      environmentName: test
      azureEnvironment: Terraform-Test-Env
      variableGroup: accounting-terraform-test
      stateKey: accounting-test.tfstate
      dependsOn:
        - ApplyDev
      azureServiceConnection: ${{ parameters.azureServiceConnection }}

  - template: infra/azure/pipeline-steps/environment-stages.yml
    parameters:
      stageSuffix: Prod
      environmentName: prod
      azureEnvironment: Terraform-Prod-Env
      variableGroup: accounting-terraform-prod
      stateKey: accounting-prod.tfstate
      dependsOn:
        - ApplyTest
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
